<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightbox Layout Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Simulate viewport for consistent testing */
    body { margin: 0; background: #111; font-family: system-ui, sans-serif; }
    .viewport { width: 100vw; height: 100vh; position: relative; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-8 p-8 text-white">
    <h1 class="text-2xl">灯箱布局对比测试</h1>

    <section>
      <h2 class="text-lg text-red-400">旧布局：固定 3:4 + object-contain（图片超出屏幕）</h2>
      <div class="viewport relative flex items-center justify-center bg-black/95">
        <div class="absolute right-4 top-4 z-10 h-12 w-12 rounded-full bg-white/10"></div>
        <div class="absolute left-2 top-1/2 z-10 h-12 w-12 -translate-y-1/2 rounded-full bg-white/10"></div>
        <div class="absolute right-2 top-1/2 z-10 h-12 w-12 -translate-y-1/2 rounded-full bg-white/10"></div>

        <!-- Old layout -->
        <div class="relative max-h-[90vh] w-full max-w-4xl px-4">
          <div class="relative aspect-[3/4] w-full">
            <img
              src="https://www.nihplod.cn/uploads/products/1776943291622-14197a9d-c5a7-4a77-ba2c-21243b292672.webp"
              alt="square texture"
              class="absolute inset-0 h-full w-full object-contain"
            />
          </div>
        </div>

        <div class="absolute bottom-6 left-1/2 z-10 -translate-x-1/2 rounded-full bg-white/10 px-4 py-1.5 text-sm text-white">
          2 / 3
        </div>
      </div>
    </section>

    <section>
      <h2 class="text-lg text-green-400">新布局：自然比例 + 自适应视口（符合最佳实践）</h2>
      <div class="viewport relative flex items-center justify-center bg-black/95">
        <div class="absolute right-4 top-4 z-10 h-12 w-12 rounded-full bg-white/10"></div>
        <div class="absolute left-2 top-1/2 z-10 h-12 w-12 -translate-y-1/2 rounded-full bg-white/10"></div>
        <div class="absolute right-2 top-1/2 z-10 h-12 w-12 -translate-y-1/2 rounded-full bg-white/10"></div>

        <!-- New layout -->
        <div class="relative flex max-h-[90vh] w-full max-w-4xl items-center justify-center px-4">
          <img
            src="https://www.nihplod.cn/uploads/products/1776943291622-14197a9d-c5a7-4a77-ba2c-21243b292672.webp"
            alt="square texture"
            class="max-h-[90vh] h-auto w-auto max-w-full object-contain"
          />
        </div>

        <div class="absolute bottom-6 left-1/2 z-10 -translate-x-1/2 rounded-full bg-white/10 px-4 py-1.5 text-sm text-white">
          2 / 3
        </div>
      </div>
    </section>
  </div>
</body>
</html>
