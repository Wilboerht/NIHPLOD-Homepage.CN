<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能测肤 | Myskin.Today</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F0EDE1;
            --accent-color: #3D4430;
            --text-primary: #1A1A1A;
            --text-secondary: #5E5E5E;
            --border-thin: 1px solid rgba(61, 68, 48, 0.15);
            --grid-gap: 2rem;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Paper Grain Texture */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            gap: var(--grid-gap);
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: var(--border-thin);
            padding-bottom: 2rem;
        }

        .logo {
            height: 32px;
            mix-blend-mode: multiply;
        }

        .specimen-id {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        /* Main Section */
        main {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            align-items: center;
            gap: var(--grid-gap);
        }

        .image-container {
            grid-column: 2 / 6;
            position: relative;
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ip-image {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(0.2) contrast(1.05);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        .frame-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent-color);
        }
        .top-left { top: -10px; left: -10px; border-right: none; border-bottom: none; }

        .content-block {
            grid-column: 7 / 12;
            padding-left: 2rem;
            animation: revealRight 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .category-tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
            display: block;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        h1 span {
            display: block;
            font-weight: 600;
        }

        .intro-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            max-width: 480px;
            position: relative;
        }

        .intro-text::before {
            content: "";
            position: absolute;
            left: -2rem;
            top: 0.5rem;
            height: 80%;
            width: 1px;
            background-color: var(--accent-color);
            opacity: 0.3;
        }

        /* Button Design */
        .cta-button {
            display: inline-flex;
            align-items: center;
            padding: 1.2rem 3.5rem;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background-color: transparent;
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .cta-button .btn-label-en {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            margin-left: 1rem;
            opacity: 0.7;
        }

        /* Privacy & Footer */
        footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 2rem;
            border-top: var(--border-thin);
            margin-top: 2rem;
        }

        .privacy-hint {
            display: flex;
            gap: 2rem;
        }

        .hint-item {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .hint-item strong {
            display: block;
            color: var(--accent-color);
            margin-bottom: 0.2rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .copyright {
            font-size: 0.7rem;
            color: rgba(0,0,0,0.4);
            max-width: 300px;
            text-align: right;
            line-height: 1.5;
        }

        /* Animations */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes revealRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container { padding: 1.5rem; }
            .image-container { grid-column: 1 / 6; }
            .content-block { grid-column: 6 / 13; padding-left: 1rem; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; display: flex; flex-direction: column-reverse; }
            .image-container { width: 80%; margin: 2rem auto; }
            .content-block { padding: 0; text-align: center; }
            .intro-text { margin: 2rem auto; }
            .intro-text::before { display: none; }
            footer { flex-direction: column; align-items: center; gap: 2rem; text-align: center; }
            .copyright { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="texture-overlay"></div>
    
    <div class="container">
        <header>
            <img src="https://wp-cdn.4ce.cn/v2/SItKqUC.png" alt="Logo" class="logo">
            <div class="specimen-id">Ref: AI-DERMA-2024 / P-01</div>
        </header>

        <main>
            <section class="image-container">
                <div class="frame-corner top-left"></div>
                <img src="https://wp-cdn.4ce.cn/v2/bP048kN.png" alt="小旎老师" class="ip-image">
            </section>

            <section class="content-block">
                <span class="category-tag"># AI智能测肤</span>
                <h1>
                    您口袋里的
                    <span>专属护肤导师</span>
                </h1>
                
                <div class="intro-text">
                    你好，我是小旎老师。<p>为了精准分析你的肌肤状态并生成专业定制化报告，接下来我将引导你进行 <strong>问卷调查</strong> 与 <strong>面部信息采集</strong>。
                    <br><br>
                    整个过程非常简单，预计占用 <strong>2-5 分钟</strong>，请在 <strong>素颜</strong> 及光线充足的环境下进行操作。本测试严格遵守隐私保护条款，所有采集信息仅用于实时分析计算及临时版报告生成。
                </div>

                <a href="#" class="cta-button">
                    立即开启
                    
                </a>
            </section>
        </main>

        <footer>
            <div class="privacy-hint">
                <div class="hint-item">
                    <strong>Phase 01</strong>
                    多维问卷调研
                </div>
                <div class="hint-item">
                    <strong>Phase 02</strong>
                    面部数据采样
                </div>
                <div class="hint-item">
                    <strong>Phase 03</strong>
                    定制报告生成
                </div>
            </div>
            <div class="copyright">
                本站护肤检测相关大数据及人工智能技术<p>由 MySkin.Today 提供服务支持
                
            </div>
        </footer>
    </div>

    <script>
        // Subtle Mouse Interaction for Materiality
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.ip-image').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Entrance Reveal Sequence
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
