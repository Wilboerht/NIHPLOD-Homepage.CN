<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSO 接入示例 — 纯 HTML/JS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 1.5rem;
    }
    h1 { color: #1f2937; }
    .card {
      background: #f3f4f6;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      min-width: 350px;
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-danger {
      background: #ef4444;
    }
    .btn-danger:hover { background: #dc2626; }
    .user-info {
      background: #f3f4f6;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: left;
      line-height: 1.8;
    }
    .error {
      color: #dc2626;
      background: #fef2f2;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #fecaca;
    }
    .info {
      margin-top: 1rem;
      color: #6b7280;
      max-width: 480px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>SSO 接入示例 — 纯 HTML/JS</h1>
  <div id="app">
    <div class="card">
      <p>加载中...</p>
    </div>
  </div>

  <!--
    本示例使用 ESM import map 加载 SDK。
    实际项目中请通过 npm 安装：npm install @nihplod/sso-sdk
  -->
  <script type="importmap">
  {
    "imports": {
      "@nihplod/sso-sdk": "../../packages/sso-sdk/dist/index.mjs"
    }
  }
  </script>

  <script type="module">
    import { SsoClient } from "@nihplod/sso-sdk";

    // ⚠️ 使用前请替换为你的实际配置
    const SSO_CONFIG = {
      clientId: "your-client-id",      // ← 替换
      redirectUri: location.origin + location.pathname,
      ssoBaseUrl: "https://nihplod.cn",
      scopes: "openid profile phone",
    };

    const sso = new SsoClient(SSO_CONFIG);

    const app = document.getElementById("app");

    function render(html) {
      app.innerHTML = html;
    }

    /**
     * HTML 转义：任何来自服务端/用户的动态文本拼入 innerHTML 前必须调用，
     * 防止 XSS（昵称、错误描述等均可包含恶意标记）。
     */
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[ch]);
    }

    async function main() {
      // 如果是回调页面（URL 中有 code 参数）
      if (window.location.search.includes("code=")) {
        render('<div class="card"><p>正在处理登录回调...</p></div>');

        try {
          await sso.handleCallback(window.location.href);
          // 清除 URL 中的 code 参数
          window.history.replaceState({}, "", window.location.pathname);
          // 显示用户信息
          await showUserInfo();
        } catch (err) {
          render(`
            <div class="error">
              <p><strong>登录失败</strong></p>
              <p>${escapeHtml(err.description || err.message)}</p>
            </div>
            <a href="${window.location.pathname}" class="btn">重试</a>
          `);
        }
        return;
      }

      // 检查登录状态
      if (sso.isAuthenticated()) {
        await showUserInfo();
      } else {
        render(`
          <div class="card">
            <p style="margin-bottom: 1rem;">此示例展示如何使用 NIHPLOD SSO SDK 零依赖接入。</p>
            <button class="btn" id="loginBtn">
              使用 NIHPLOD 账号登录
            </button>
          </div>
          <div class="info">
            <p><strong>支持方式：</strong></p>
            <ol>
              <li>点击上方按钮 → 跳转 SSO 登录页</li>
              <li>登录后 → 自动回调本页面</li>
              <li>SDK 自动交换 token；token 默认保存在<strong>内存</strong>中（刷新页面后需重新登录），PKCE/state 等临时数据保存在 sessionStorage</li>
            </ol>
          </div>
        `);

        document.getElementById("loginBtn").addEventListener("click", () => {
          sso.login();
        });
      }
    }

    async function showUserInfo() {
      try {
        const user = await sso.getUserInfo();
        render(`
          <div class="card">
            <h2 style="margin-bottom: 1rem;">欢迎, ${escapeHtml(user.nickname || "用户")}！</h2>
            <div class="user-info">
              <p><strong>用户 ID:</strong> ${escapeHtml(user.sub)}</p>
              ${user.phone ? `<p><strong>手机号:</strong> ${escapeHtml(user.phone)}</p>` : ""}
              ${user.membership_level ? `<p><strong>会员等级:</strong> ${escapeHtml(user.membership_level)}</p>` : ""}
              ${user.total_points != null ? `<p><strong>积分:</strong> ${escapeHtml(user.total_points)}</p>` : ""}
            </div>
            <div style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center;">
              <button class="btn" id="refreshBtn">刷新信息</button>
              <button class="btn btn-danger" id="logoutBtn">退出登录</button>
            </div>
          </div>
        `);

        document.getElementById("refreshBtn").addEventListener("click", async () => {
          await showUserInfo();
        });
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await sso.logout(true);
        });
      } catch (err) {
        render(`
          <div class="error">
            <p>获取用户信息失败: ${escapeHtml(err.description || err.message)}</p>
          </div>
          <button class="btn" onclick="location.reload()">重新加载</button>
        `);
      }
    }

    main().catch((err) => {
      render(`
        <div class="error">
          <p>初始化失败: ${escapeHtml(err.description || err.message || err)}</p>
        </div>
      `);
    });
  </script>
</body>
</html>
