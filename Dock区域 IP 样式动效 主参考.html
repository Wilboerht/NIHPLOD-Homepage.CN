<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA | 高端护肤品牌</title>
    <style>
        :root {
            --primary: #F0EDE1;
            --text-dark: #2A2825;
            --accent: #D4C9B5;
            --glass: rgba(240, 237, 225, 0.85);
            --transition-smooth: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            --font-sans: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000;
            background-image: url('https://wp-cdn.4ce.cn/v2/c7b7XZG.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: var(--font-sans);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Overlay for sophisticated depth */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
            pointer-events: none;
        }

        /* Main Content Header Area */
        .hero-section {
            position: relative;
            padding: 60px 80px;
            z-index: 2;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .brand-name {
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 300;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            color: var(--primary);
            line-height: 1.1;
            font-weight: 300;
            max-width: 800px;
        }

        /* Sculpted Alabaster Dock Container */
        .dock-wrapper {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: 90%;
            max-width: 1100px;
            z-index: 100;
            animation: dockEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
        }

        .dock-container {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(120%);
            -webkit-backdrop-filter: blur(25px) saturate(120%);
            border-radius: 40px; /* Approximately 20% of typical height for rounded feel */
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* AI Skin Analysis Section (Left) */
        .ai-section {
            display: flex;
            align-items: center;
            gap: 24px;
            position: relative;
        }

        .ai-image-frame {
            position: relative;
            width: 110px;
            height: 110px;
            margin-top: -50px; /* Visual impact overflow */
            transition: var(--transition-smooth);
        }

        /* Geometric Frame Element */
        .ai-image-frame::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: rotateFrame 10s linear infinite;
        }

        .ai-image-frame::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1.5px solid var(--accent);
            border-radius: 50%;
            clip-path: polygon(0 0, 50% 0, 50% 50%, 0 50%);
            animation: rotateFrame 4s linear infinite reverse;
        }

        .ai-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: #fff;
            padding: 4px;
        }

        .ai-cta {
            display: flex;
            flex-direction: column;
        }

        .ai-cta .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.05em;
        }

        .ai-cta .subtitle {
            font-size: 0.75rem;
            color: rgba(42, 40, 37, 0.6);
            margin-top: 4px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .ai-btn {
            margin-top: 10px;
            background: var(--text-dark);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #444;
        }

        /* Navigation Section (Right) */
        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            transition: var(--transition-smooth);
            position: relative;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 6px;
            opacity: 0.7;
            transition: var(--transition-smooth);
        }

        .nav-item span {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .nav-item:hover {
            transform: translateY(-5px);
            color: #000;
        }

        .nav-item:hover svg {
            opacity: 1;
            transform: scale(1.1);
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -8px;
            width: 4px;
            height: 4px;
            background: var(--text-dark);
            border-radius: 50%;
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .nav-item:hover::after {
            opacity: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dockEntry {
            to { transform: translateX(-50%) translateY(0); }
        }

        @keyframes rotateFrame {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Interactive Hover for AI image */
        .ai-section:hover .ai-image-frame {
            transform: scale(1.05) translateY(-5px);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .nav-links { gap: 15px; }
            .nav-item span { display: none; }
            .ai-cta .subtitle { display: none; }
            .hero-title { font-size: 2.5rem; }
            .hero-section { padding: 40px; }
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <div class="brand-name">Lumina Essentia</div>
        <h1 class="hero-title">雕琢时光<br>凝萃于肌</h1>
    </header>

    <div class="dock-wrapper">
        <div class="dock-container">
            <!-- AI Section -->
            <div class="ai-section">
                <div class="ai-image-frame">
                    <img src="https://wp-cdn.4ce.cn/v2/3ZwM4mj.png" alt="AI Skin Lab">
                </div>
                <div class="ai-cta">
                    <span class="title">在线测肤</span>
                    <span class="subtitle">Online Skin Analysis</span>
                    <button class="ai-btn">
                        <span>免费使用</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <!-- Navigation Section -->
            <nav class="nav-links">
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>首页</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <span>了解产品</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                    <span>护肤仪式</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>关于我们</span>
                </a>
            </nav>
        </div>
    </div>

    <script>
        // Subtle Mouse parallax for the AI frame
        document.addEventListener('mousemove', (e) => {
            const frame = document.querySelector('.ai-image-frame');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            frame.style.transform = `translate(${x}px, ${y}px) rotate(${x/2}deg)`;
        });

        // Click effects
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(i => i.style.opacity = '0.5');
                item.style.opacity = '1';
                item.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    item.style.transform = 'scale(1)';
                    navItems.forEach(i => i.style.opacity = '1');
                }, 200);
            });
        });
    </script>
</body>
</html>
