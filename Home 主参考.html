<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin Skin | 极简高端护肤</title>
    <style>
        :root {
            --bg-color: #F0EDE1;
            --text-color: #3A3530;
            --accent-morandi: #A89F91;
            --accent-dark: #6B655E;
            --new-bubble: #FFD700;
            --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            --transition-smooth: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mineral Texture Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 10;
        }

        /* Animated Waves Background */
        .wave-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 100%;
            top: 10%;
            left: -50%;
            opacity: 0.4;
        }

        .wave path {
            fill: none;
            stroke: #DED9C7;
            stroke-width: 1px;
        }

        @keyframes waveMove {
            0% { transform: translateX(0) translateY(0) rotate(0deg); }
            50% { transform: translateX(5%) translateY(-2%) rotate(1deg); }
            100% { transform: translateX(0) translateY(0) rotate(0deg); }
        }

        .wave-1 { animation: waveMove 15s ease-in-out infinite; }
        .wave-2 { animation: waveMove 20s ease-in-out infinite reverse; opacity: 0.2; }

        /* Main Layout */
        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 220px;
            height: auto;
            margin-bottom: 3.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 1.2s forwards 0.2s;
            filter: grayscale(0.2) contrast(1.1);
        }

        .content-wrapper {
            max-width: 480px;
            margin-bottom: 4rem;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.15em;
            color: var(--accent-dark);
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 1.2s forwards 0.5s;
        }

        .title span {
            display: inline-block;
            word-break: keep-all;
        }

        /* Buttons Section */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 1.2s forwards 0.8s;
        }

        .btn {
            position: relative;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            border-radius: 8px; /* Approx 10% based on aesthetic feel */
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .btn-primary {
            width: 280px;
            height: 54px;
            background-color: var(--accent-morandi);
            color: white;
            box-shadow: 0 10px 30px rgba(168, 159, 145, 0.15);
        }

        .btn-primary:hover {
            background-color: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(168, 159, 145, 0.25);
        }

        .btn-secondary {
            width: 180px;
            height: 48px;
            background-color: transparent;
            color: var(--accent-dark);
            border: 1px solid rgba(168, 159, 145, 0.4);
        }

        .btn-secondary:hover {
            border-color: var(--accent-dark);
            background-color: rgba(255,255,255,0.3);
        }

        /* New Badge */
        .badge-new {
            position: absolute;
            right: -12px;
            top: -12px;
            background-color: var(--new-bubble);
            color: #333;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            letter-spacing: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Responsive Refinements */
        @media (max-width: 600px) {
            .logo { width: 160px; margin-bottom: 2.5rem; }
            .title { 
                font-size: 0.95rem; 
                line-height: 1.8;
                padding: 0 10px;
            }
            .content-wrapper { margin-bottom: 3rem; }
            .btn-primary { width: 240px; }
            .btn-secondary { width: 160px; }
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="wave-container">
        <svg class="wave wave-1" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,60 C150,110 350,10 500,60 C650,110 850,10 1000,60 C1150,110 1350,10 1500,60" />
        </svg>
        <svg class="wave wave-2" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,40 C200,90 400,0 600,40 C800,80 1000,0 1200,40" />
        </svg>
    </div>

    <main class="container">
        <img src="https://wp-cdn.4ce.cn/v2/SItKqUC.png" alt="Brand Logo" class="logo">

        <div class="content-wrapper">
            <h1 class="title">
                <span>海豚的肌肤，拥有每两小时</span><br>
                <span>自我更新的神奇能力。</span><br>
                <span>这种「逆转时光」的动物本能，</span><br>
                <span>是我们灵感的来源。</span>
            </h1>
        </div>

        <div class="button-group">
            <a href="#" class="btn btn-primary">探索更多</a>
            <a href="#" class="btn btn-secondary">
                AI快速测肤
                <span class="badge-new">NEW</span>
            </a>
        </div>
    </main>

    <script>
        // Subtle mouse parallax effect for waves
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.wave-1').style.transform = `translate(${moveX}px, ${moveY}px)`;
            document.querySelector('.wave-2').style.transform = `translate(${-moveX}px, ${-moveY}px)`;
        });
    </script>
</body>
</html>
