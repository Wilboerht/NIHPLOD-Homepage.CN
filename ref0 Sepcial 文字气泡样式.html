<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Skincare | Flash UI</title>
    <style>
        :root {
            --primary-color: #F0EDE1;
            --text-dark: #1a1a1a;
            --accent-gold: #D4AF37;
            --glass-bg: rgba(240, 237, 225, 0.85);
            --transition-smooth: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Background with Porcelain Texture Overlay */
        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('https://wp-cdn.4ce.cn/v2/c7b7XZG.jpeg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        .page-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* Ink-Stroke Kinetic Reveal */
        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* The Dock */
        .dock-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 100px;
            background: var(--primary-color);
            border-radius: 20px; /* 20% visual feel for a pill/box hybrid */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.8);
            z-index: 10;
        }

        /* Left Section: AI Skin Analysis */
        .left-cta {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            height: 100%;
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin-top: -45px; /* Overflows dock */
            transition: var(--transition-smooth);
        }

        .avatar-container:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .avatar-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Chat Bubble */
        .chat-bubble {
            position: absolute;
            bottom: 110px;
            left: 0;
            background: #fff;
            border: 2px solid #000;
            border-radius: 18px;
            padding: 15px 20px;
            min-width: 260px;
            max-width: 320px;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.05);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        .chat-bubble.active {
            opacity: 1;
            transform: translateY(0);
        }

        .chat-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 35px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #000;
        }

        .bubble-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
            letter-spacing: 0.02em;
        }

        .bubble-text b {
            font-weight: 700;
            color: #000;
            border-bottom: 2px solid var(--accent-gold);
        }

        .cta-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cta-title {
            font-size: 13px;
            font-weight: 600;
            color: rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cta-button {
            background: #000;
            color: var(--primary-color);
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cta-button:hover {
            transform: scale(1.05);
            background: #222;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Right Section: Navigation */
        .right-nav {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: 500;
            position: relative;
            transition: var(--transition-smooth);
            padding: 8px 0;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
            transition: var(--transition-smooth);
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1.5px;
            background: #000;
            transition: var(--transition-smooth);
        }

        .nav-item:hover {
            opacity: 0.7;
        }

        .nav-item:hover::after {
            width: 100%;
        }

        .nav-item:hover svg {
            transform: translateY(-2px);
            opacity: 1;
        }

        /* Branding Logic */
        .brand-logo {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--primary-color);
        }

        .brand-logo h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .brand-logo p {
            font-size: 12px;
            letter-spacing: 4px;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="brand-logo fade-in-up">
            <h1>ELEVÉ</h1>
            <p>ADVANCED SKINCARE LABORATORY</p>
        </div>

        <div class="dock-container fade-in-up">
            <!-- Left Side -->
            <div class="left-cta">
                <div class="avatar-container">
                    <div class="chat-bubble" id="chatBubble">
                        <div class="bubble-text" id="bubbleContent"></div>
                    </div>
                    <div class="avatar-circle">
                        <img src="https://wp-cdn.4ce.cn/v2/3ZwM4mj.png" alt="小旎老师">
                    </div>
                </div>
                <div class="cta-info">
                    <span class="cta-title">在线测肤</span>
                    <button class="cta-button">
                        免费使用
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <!-- Right Side -->
            <nav class="right-nav">
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></nav-item>
                    了解产品
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    关于我们
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    护肤仪式
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    返回首页
                </a>
            </nav>
        </div>
    </div>

    <script>
        const bubble = document.getElementById('chatBubble');
        const content = document.getElementById('bubbleContent');
        
        const messages = [
            `Hi 🖐️ 我是护肤顾问 <b>小旎老师</b>,<br>很高兴见到你!`,
            `为获得更好的护肤效果,<br>建议先用2分钟检测下自己当前的皮肤状况哦! ♥️`
        ];

        let msgIndex = 0;

        async function typeWriter(text) {
            content.innerHTML = '';
            bubble.classList.add('active');
            
            // Temporary container to handle HTML tags while typing
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = text;
            let nodes = Array.from(tempDiv.childNodes);
            
            for (let node of nodes) {
                if (node.nodeType === Node.TEXT_NODE) {
                    for (let char of node.textContent) {
                        content.innerHTML += char;
                        await new Promise(r => setTimeout(r, 50));
                    }
                } else {
                    // It's an HTML element (like <b> or <br>)
                    content.innerHTML += node.outerHTML;
                    // For nested text in bold tags, we could type it, but for simplicity we inject it
                }
            }

            // Wait 6 seconds after full display
            setTimeout(() => {
                bubble.classList.remove('active');
                setTimeout(() => {
                    msgIndex = (msgIndex + 1) % messages.length;
                    typeWriter(messages[msgIndex]);
                }, 800); // Wait for fade out
            }, 6000);
        }

        // Start the cycle
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                typeWriter(messages[0]);
            }, 1500);
        });
    </script>
</body>
</html>
