                    - heading "一、您主动提供的个人信息" [level=3] [ref=e67]
                    - paragraph [ref=e69]: 当您使用我们的服务时，我们可能会收集您主动提供的以下信息：
                    - paragraph [ref=e73]: 身份信息：包括您的姓名、性别、出生日期等基本身份信息
                    - paragraph [ref=e76]: 联系信息：包括您的电子邮箱地址、电话号码、收货地址等
                    - paragraph [ref=e79]: 账户信息：包括您设置的用户名、密码（加密存储）、头像等
                    - paragraph [ref=e82]: 护肤相关信息：包括您的肤质类型、肌肤问题、过敏史、护肤习惯等您在咨询过程中自愿提供的信息
                    - paragraph [ref=e85]: 交易信息：包括您的订单详情、支付记录、物流信息等与购买相关的信息
                    - paragraph [ref=e88]: 反馈信息：包括您提交的产品评价、投诉建议、问卷调查回复等
                  - generic [ref=e89]:
                    - heading "二、我们自动收集的信息" [level=3] [ref=e90]
                    - paragraph [ref=e92]: 当您访问我们的网站或使用我们的服务时，我们会自动收集以下技术信息：
                    - paragraph [ref=e96]: 设备信息：包括设备型号、操作系统及版本、设备设置、唯一设备标识符、设备环境等软硬件特征信息
                    - paragraph [ref=e99]: 网络信息：包括 IP 地址、网络类型、运营商信息、网络环境等
                    - paragraph [ref=e102]: 日志信息：包括访问时间、访问时长、浏览记录、搜索记录、点击记录、错误日志等
                    - paragraph [ref=e105]: 位置信息：基于 IP 地址推断的大致地理位置（城市级别）
                  - generic [ref=e106]:
                    - heading "三、Cookies 和类似技术" [level=3] [ref=e107]
                    - paragraph [ref=e109]: 我们使用 Cookies 和类似的跟踪技术来收集和存储您的相关信息。这些技术帮助我们：
                    - paragraph [ref=e113]: 记住您的登录状态和偏好设置
                    - paragraph [ref=e116]: 分析网站流量和使用情况
                    - paragraph [ref=e119]: 提供个性化的内容和推荐
                    - paragraph [ref=e122]: 防范欺诈和保障账户安全
                    - paragraph [ref=e124]: 您可以通过浏览器设置管理或删除 Cookies，但这可能会影响您使用我们服务的部分功能。
                - generic [ref=e126]:
                  - generic [ref=e127]:
                    - heading "一、提供产品和服务" [level=3] [ref=e128]
                    - paragraph [ref=e130]: 我们使用您的个人信息来：
                    - paragraph [ref=e134]: 处理和完成您的订单，包括发货、支付处理和售后服务
                    - paragraph [ref=e137]: 提供客户支持，响应您的咨询、投诉和建议
                    - paragraph [ref=e140]: 根据您的肤质和需求提供个性化的护肤建议和产品推荐
                    - paragraph [ref=e143]: 验证您的身份，保障您的账户和交易安全
                    - paragraph [ref=e146]: 履行我们与您之间的合同义务
                  - generic [ref=e147]:
                    - heading "二、改进和优化服务" [level=3] [ref=e148]
                    - paragraph [ref=e150]: 我们会将收集的信息用于：
                    - paragraph [ref=e154]: 分析用户行为和偏好，了解产品和服务的使用情况
                    - paragraph [ref=e157]: 开展内部审计、数据分析和研究，改进我们的产品和服务
                    - paragraph [ref=e160]: 测试和开发新的产品功能
                    - paragraph [ref=e163]: 优化网站性能和用户体验
                    - paragraph [ref=e166]: 进行市场调研和数据统计分析
                  - generic [ref=e167]:
                    - heading "三、营销和推广" [level=3] [ref=e168]
                    - paragraph [ref=e170]: 在获得您明确同意的情况下，我们可能会：
                    - paragraph [ref=e174]: 向您发送产品资讯、促销活动、新品上市等营销信息
                    - paragraph [ref=e177]: 向您推送个性化的广告和推荐内容
                    - paragraph [ref=e180]: 邀请您参与调查问卷、用户访谈等市场研究活动
                    - paragraph [ref=e182]: 您可以随时选择退订营销信息，这不会影响您使用我们的基本服务。
                  - generic [ref=e183]:
                    - heading "四、法律合规" [level=3] [ref=e184]
                    - paragraph [ref=e186]: 我们可能会在以下情况下使用您的信息：
                    - paragraph [ref=e190]: 遵守适用的法律法规、法规要求或政府命令
                    - paragraph [ref=e193]: 执行我们的服务条款和其他协议
                    - paragraph [ref=e196]: 保护我们、用户或公众的权利、财产或安全
                    - paragraph [ref=e199]: 检测、预防或解决欺诈、安全或技术问题
                - generic [ref=e201]:
                  - generic [ref=e202]:
                    - heading "一、技术安全措施" [level=3] [ref=e203]
                    - paragraph [ref=e205]: 我们采用业界标准的安全技术来保护您的个人信息：
                    - paragraph [ref=e209]: 数据传输加密：所有数据传输均采用 SSL/TLS 加密协议，确保传输过程中的数据安全
                    - paragraph [ref=e212]: 数据存储加密：敏感个人信息在存储时采用加密处理
                    - paragraph [ref=e215]: 访问控制：实施严格的访问权限管理，仅授权人员可访问个人信息
                    - paragraph [ref=e218]: 安全审计：定期进行安全审计、渗透测试和漏洞扫描
                    - paragraph [ref=e221]: 入侵检测：部署入侵检测和防护系统，实时监控异常行为
                    - paragraph [ref=e224]: 数据备份：定期进行数据备份，确保数据的可恢复性
                  - generic [ref=e225]:
                    - heading "二、组织管理措施" [level=3] [ref=e226]
                    - paragraph [ref=e228]: 我们建立了完善的数据保护管理体系：
                    - paragraph [ref=e232]: 设立专门的数据保护负责人，负责监督个人信息保护工作
                    - paragraph [ref=e235]: 对员工进行数据保护培训，签署保密协议
                    - paragraph [ref=e238]: 建立数据分类分级制度，对不同敏感程度的数据采取不同的保护措施
                    - paragraph [ref=e241]: 与第三方服务提供商签订数据保护协议，确保其遵守同等的保护标准
                    - paragraph [ref=e244]: 制定数据泄露应急响应预案，确保及时有效地应对安全事件
                  - generic [ref=e245]:
                    - heading "三、数据保留" [level=3] [ref=e246]
                    - paragraph [ref=e248]: 我们仅在实现本政策所述目的所必需的期限内保留您的个人信息：
                    - paragraph [ref=e252]: 账户信息：在您的账户有效期内保留，账户注销后将在合理期限内删除
                    - paragraph [ref=e255]: 交易记录：根据适用的财务和税务法规要求保留相应期限
                    - paragraph [ref=e258]: 日志信息：通常保留不超过 12 个月
                    - paragraph [ref=e260]: 超出保留期限后，我们将删除或匿名化处理您的个人信息。
                  - generic [ref=e261]:
                    - heading "四、第三方共享" [level=3] [ref=e262]
                    - paragraph [ref=e264]: 我们承诺不会出售您的个人信息。在以下情况下，我们可能会与第三方共享您的信息：
                    - paragraph [ref=e268]: 服务提供商：与帮助我们提供服务的合作伙伴共享（如物流公司、支付服务商）
                    - paragraph [ref=e271]: 法律要求：根据法律法规要求或政府机关的强制性要求
                    - paragraph [ref=e274]: 业务转让：在公司合并、收购或资产转让时，您的信息可能作为交易资产的一部分被转让
                    - paragraph [ref=e276]: 我们会要求所有第三方遵守适用的数据保护法规，并采取适当的安全措施。
                - generic [ref=e278]:
                  - paragraph [ref=e280]: 根据《中华人民共和国个人信息保护法》及其他适用的数据保护法律，您对您的个人信息享有以下权利：
                  - generic [ref=e281]:
                    - heading "一、知情权和决定权" [level=3] [ref=e282]
                    - paragraph [ref=e284]: 您有权了解我们如何收集、使用、共享和保护您的个人信息。您有权决定是否同意我们处理您的个人信息，并可随时撤回您的同意。撤回同意不影响撤回前基于您同意所进行的处理活动的合法性。
                  - generic [ref=e285]:
                    - heading "二、查阅和复制权" [level=3] [ref=e286]
                    - paragraph [ref=e288]: 您有权查阅我们持有的关于您的个人信息，并有权获取该信息的副本。我们将在验证您的身份后，在合理期限内响应您的请求。对于超出合理范围的请求，我们可能会收取合理的费用。
                  - generic [ref=e289]:
                    - heading "三、更正和补充权" [level=3] [ref=e290]
                    - paragraph [ref=e292]: 当您发现我们持有的个人信息不准确或不完整时，您有权要求我们进行更正或补充。我们将在核实后及时更新相关信息。
                  - generic [ref=e293]:
                    - heading "四、删除权" [level=3] [ref=e294]
                    - paragraph [ref=e296]: 在以下情况下，您有权要求我们删除您的个人信息：
                    - paragraph [ref=e300]: 处理目的已实现、无法实现或者为实现处理目的不再必要
                    - paragraph [ref=e303]: 我们停止提供产品或者服务，或者保存期限已届满
                    - paragraph [ref=e306]: 您撤回同意，且我们无其他合法处理依据
                    - paragraph [ref=e309]: 我们违反法律法规或与您的约定处理个人信息
                    - paragraph [ref=e311]: 法律法规规定的保存期限未届满，或删除技术上难以实现的，我们将停止除存储和采取必要安全保护措施之外的处理。
                  - generic [ref=e312]:
                    - heading "五、限制或拒绝处理权" [level=3] [ref=e313]
                    - paragraph [ref=e315]: 在特定情况下，您有权要求我们限制对您个人信息的处理，或拒绝我们对您个人信息的处理，包括拒绝接收营销信息。
                  - generic [ref=e316]:
                    - heading "六、数据可携带权" [level=3] [ref=e317]
                    - paragraph [ref=e319]: 您有权以结构化、通用的机器可读格式获取您的个人信息副本，并在技术可行的情况下，要求我们将您的个人信息直接传输给其他数据控制者。
                  - generic [ref=e320]:
                    - heading "七、行使权利的方式" [level=3] [ref=e321]
                    - paragraph [ref=e323]: 如您需要行使上述权利，可通过本网站的「联系我们」页面提交请求。我们将在验证您的身份后，在 15 个工作日内响应您的请求。对于复杂或多次请求，我们可能需要延长响应时间，届时我们会告知您。
