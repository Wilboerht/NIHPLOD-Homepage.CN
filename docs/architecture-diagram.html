<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NIHPLOD System Architecture</title>
<style>
  :root {
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --line: #3b6ea5;
    --link: #8c8c8c;
    --bronze: #8a6a3b;
    --paper: #f7f5f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #ececec;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
      "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: var(--ink);
  }
  .toolbar {
    max-width: 1840px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    margin: 0 auto 0 0;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: .2px;
  }
  .toolbar button {
    appearance: none;
    border: 1px solid #c9c4b8;
    background: #fff;
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #f3f1eb; }
  .canvas {
    max-width: 1840px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #d8d3c8;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  svg { display: block; width: 100%; height: auto; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .canvas { max-width: none; border: none; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>NIHPLOD System Architecture</h1>
  <button onclick="downloadSvg()">下载 SVG</button>
  <button onclick="downloadPng()">下载 PNG</button>
  <button onclick="copySvg()">复制 SVG 源码</button>
  <button onclick="window.print()">打印 / 存 PDF</button>
</div>

<div class="canvas">

    .box { fill:#ffffff; stroke:#2b2b2b; stroke-width:1.5; }

    .box-title { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#1f1f1f; text-anchor:middle; }
    .box-sub { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#6b6b6b; text-anchor:middle; }
    .edge { fill:none; stroke:#3b6ea5; stroke-width:1.5; }
    .edge-dash { fill:none; stroke:#8c8c8c; stroke-width:1.2; stroke-dasharray:5 4; }
    .edge-double { fill:none; stroke:#3b6ea5; stroke-width:1.5; }
    .label-bg { fill:#ffffff; stroke:none; }
    .label { font: 11px system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#3f3f3f; }
    .note { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#5a5a5a; }

  <!-- ================= Notes ================= -->

  <!-- ================= Caption ================= -->
  <text class="caption" x="40" y="1045">Figure 1. NIHPLOD system architecture. Solid arrows: system calls / data flows; dashed arrows: links / weak relationships.</text>
</svg>
</div>

<script>
  function getSvgSource() {
    return document.getElementById('diagram').outerHTML;
  }

  function downloadSvg() {
    const blob = new Blob([getSvgSource()], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nihplod-architecture.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadPng() {
    const svg = document.getElementById('diagram');
    const clone = svg.cloneNode(true);
    clone.setAttribute('width', '1840');
    clone.setAttribute('height', '1080');
    const source = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = function () {
      const scale = 2;
      const canvas = document.createElement('canvas');
      canvas.width = 1840 * scale;
      canvas.height = 1080 * scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (pngBlob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(pngBlob);
        a.download = 'nihplod-architecture.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      alert('PNG 导出失败，请用“下载 SVG”。');
    };
    img.src = url;
  }

  async function copySvg() {
    try {
      await navigator.clipboard.writeText(getSvgSource());
      alert('SVG 源码已复制到剪贴板');
    } catch (e) {
      alert('复制失败，请用“下载 SVG”。');
    }
  }
</script>

</body>
</html>
