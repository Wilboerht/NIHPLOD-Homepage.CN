<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE SKINCARE | 了解产品</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #F0EDE1;
            --primary-color: #00263E;
            --accent-soft: rgba(0, 38, 62, 0.08);
            --line-weight: 1px;
            --transition-smooth: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Decorative Background Elements --- */
        .frame-line {
            position: fixed;
            border: var(--line-weight) solid var(--accent-soft);
            z-index: 0;
            pointer-events: none;
        }
        .line-v-1 { top: 0; bottom: 0; left: 5%; width: 1px; }
        .line-v-2 { top: 0; bottom: 0; right: 5%; width: 1px; }
        .line-h-1 { left: 0; right: 0; top: 120px; height: 1px; }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 100;
            background: rgba(240, 237, 225, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            height: 40px;
            transition: var(--transition-smooth);
        }
        .logo:hover { opacity: 0.7; }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.1em;
            position: relative;
            padding: 4px 0;
            transition: var(--transition-smooth);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--primary-color);
            transition: var(--transition-smooth);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            fill: var(--primary-color);
        }

        /* --- Main Content --- */
        main {
            position: relative;
            padding: 180px 8% 100px;
            z-index: 1;
        }

        .section-header {
            margin-bottom: 80px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-left: 1px solid var(--primary-color);
            padding-left: 30px;
        }

        .section-title {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .section-subtitle {
            font-size: 14px;
            opacity: 0.6;
            letter-spacing: 0.3em;
            margin-bottom: 8px;
        }

        /* --- Floating Triptych Grid --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            align-items: start;
        }

        .product-card {
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        /* Staggered heights for triptych look */
        .product-card:nth-child(2) { margin-top: 60px; }
        .product-card:nth-child(3) { margin-top: -30px; }

        .image-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #fff;
            padding: 40px;
            aspect-ratio: 4/5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
        }

        .image-wrapper::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid var(--accent-soft);
            pointer-events: none;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .product-card:hover .image-wrapper {
            box-shadow: 0 30px 60px rgba(0, 38, 62, 0.1);
            border-color: rgba(0, 38, 62, 0.05);
            transform: translateY(-10px);
        }

        .product-card:hover img {
            transform: scale(1.08);
        }

        .product-info {
            margin-top: 30px;
            padding: 0 10px;
        }

        .product-category {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.5;
            margin-bottom: 8px;
            display: block;
        }

        .product-name {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 15px;
        }

        .cta-discover {
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            color: var(--primary-color);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateX(-10px);
            transition: var(--transition-smooth);
        }

        .product-card:hover .cta-discover {
            opacity: 1;
            transform: translateX(0);
        }

        .arrow-line {
            width: 30px;
            height: 1px;
            background: var(--primary-color);
            position: relative;
        }
        .arrow-line::after {
            content: '';
            position: absolute;
            right: 0;
            top: -3px;
            width: 7px;
            height: 7px;
            border-right: 1px solid var(--primary-color);
            border-top: 1px solid var(--primary-color);
            transform: rotate(45deg);
        }

        /* --- Scroll Animation Reveals --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: revealUp 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes revealUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        @media (max-width: 1024px) {
            .nav-links { display: none; }
            .product-grid { grid-template-columns: 1fr; }
            .product-card:nth-child(n) { margin-top: 40px; }
            .section-title { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="frame-line line-v-1"></div>
    <div class="frame-line line-v-2"></div>
    <div class="frame-line line-h-1"></div>

    <nav>
        <img src="https://wp-cdn.4ce.cn/v2/SItKqUC.png" alt="Logo" class="logo">
        
        <div class="nav-links">
            <a href="#">精华露</a>
            <a href="#">面霜</a>
            <a href="#">护肤油</a>
            <a href="#">面膜</a>
            <a href="#">身体乳</a>
            <a href="#">防晒</a>
            <a href="#">磨砂膏</a>
            <a href="#">洁面</a>
            <a href="#">护手霜</a>
        </div>

        <div class="nav-icons">
            <button class="icon-btn" title="登录">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
            <button class="icon-btn" title="购物袋">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </nav>

    <main>
        <header class="section-header reveal">
            <div>
                <span class="section-subtitle">COLLECTION 2026</span>
                <h1 class="section-title">当季热卖</h1>
            </div>
        </header>

        <section class="product-grid">
            <!-- Product 1 -->
            <div class="product-card reveal delay-1">
                <div class="image-wrapper">
                    <img src="https://wp-cdn.4ce.cn/v2/kjtSQ0w.jpeg" alt="恒采修护面霜">
                </div>
                <div class="product-info">
                    <span class="product-category">Facial Care</span>
                    <h2 class="product-name">恒采修护面霜</h2>
                    <a href="#" class="cta-discover">
                        <span>了解更多</span>
                        <div class="arrow-line"></div>
                    </a>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-card reveal delay-2">
                <div class="image-wrapper">
                    <img src="https://wp-cdn.4ce.cn/v2/PjbWO3H.png" alt="新生焕活身体乳">
                </div>
                <div class="product-info">
                    <span class="product-category">Body Care</span>
                    <h2 class="product-name">新生焕活身体乳</h2>
                    <a href="#" class="cta-discover">
                        <span>了解更多</span>
                        <div class="arrow-line"></div>
                    </a>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="product-card reveal delay-3">
                <div class="image-wrapper">
                    <img src="https://wp-cdn.4ce.cn/v2/4xE49ai.jpeg" alt="净透温和洁面慕斯">
                </div>
                <div class="product-info">
                    <span class="product-category">Cleanser</span>
                    <h2 class="product-name">净透温和洁面慕斯</h2>
                    <a href="#" class="cta-discover">
                        <span>了解更多</span>
                        <div class="arrow-line"></div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer style="padding: 100px 5% 40px; border-top: 1px solid var(--accent-soft); margin-top: 100px;">
        <div style="display: flex; justify-content: space-between; align-items: center; opacity: 0.4; font-size: 12px; letter-spacing: 1px;">
            <span>© 2026 旎柏中国 版权所有</span>
            <div style="display: flex; gap: 40px;">
                <span>隐私政策</span>
                <span>服务条款</span>
            </div>
        </div>
    </footer>

    <script>
        // Smooth reveal on scroll could be added here, 
        // but basic CSS animation is used for the initial load.
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Flash UI: Alabaster Triptych Loaded.");
        });
    </script>
</body>
</html>
