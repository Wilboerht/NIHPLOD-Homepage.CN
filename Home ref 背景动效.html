<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin Essence | 高端护肤</title>
    <style>
        :root {
            --bg-color: #F0EDE1;
            --accent-morandi-blue: #9BB0B5;
            --accent-morandi-clay: #BFA89E;
            --accent-yellow: #F4D03F;
            --text-main: #333333;
            --text-muted: #666666;
            --transition-smooth: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
            color: var(--text-main);
        }

        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1.2s forwards 0.2s;
        }

        .logo-img {
            width: 180px;
            height: auto;
            display: block;
            filter: grayscale(1) contrast(1.1);
        }

        .content-section {
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1.2s forwards 0.5s;
        }

        .title-text {
            font-size: 1.15rem;
            line-height: 2;
            letter-spacing: 0.15em;
            font-weight: 300;
            color: var(--text-main);
            margin-bottom: 40px;
        }

        .title-text span {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1.2s forwards 0.8s;
        }

        .btn {
            position: relative;
            padding: 14px 36px;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-decoration: none;
            border-radius: 5px; /* 10% of height approx */
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-explore {
            background-color: transparent;
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--text-muted);
        }

        .btn-explore:hover {
            background-color: rgba(0,0,0,0.03);
            border-color: rgba(0,0,0,0.3);
            color: var(--text-main);
        }

        .btn-ai {
            background-color: var(--accent-morandi-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(155, 176, 181, 0.3);
        }

        .btn-ai:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(155, 176, 181, 0.4);
            filter: brightness(1.05);
        }

        .badge-new {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: var(--accent-yellow);
            color: #444;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes revealUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        /* Wave Background Animation */
        .waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            min-height: 200px;
            max-height: 400px;
        }

        .parallax > use {
            animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
        }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }

        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-img { width: 140px; }
            .title-text {
                font-size: 0.95rem;
                padding: 0 15px;
                line-height: 1.8;
            }
            .button-group {
                flex-direction: column-reverse;
                gap: 15px;
                width: 100%;
                max-width: 200px;
                margin: 0 auto;
            }
            .btn { width: 100%; padding: 12px 0; }
            .badge-new { right: 0; top: -10px; }
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
        viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(191, 168, 158, 0.1)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(155, 176, 181, 0.1)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.2)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(255,255,255,0.4)" />
            </g>
        </svg>
    </div>

    <main class="main-wrapper">
        <div class="logo-container">
            <img src="https://wp-cdn.4ce.cn/v2/SItKqUC.png" alt="Brand Logo" class="logo-img">
        </div>

        <section class="content-section">
            <p class="title-text">
                <span>海豚的肌肤拥有每两小时自我更新的神奇能力。</span>
                <span>这种「逆转时光」的动物本能，是我们灵感的来源。</span>
            </p>

            <div class="button-group">
                <a href="#" class="btn btn-explore">探索更多</a>
                <a href="#" class="btn btn-ai">
                    AI测肤
                    <span class="badge-new">NEW</span>
                </a>
            </div>
        </section>
    </main>

    <script>
        // Subtle Mouse Interaction for parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            
            const logo = document.querySelector('.logo-container');
            const content = document.querySelector('.content-section');
            
            if (window.innerWidth > 768) {
                logo.style.transform = `translate(${x}px, ${y}px)`;
                content.style.transform = `translate(${x * -0.5}px, ${y * -0.5}px)`;
            }
        });
    </script>
</body>
</html>
